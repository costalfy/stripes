name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 1.8
      uses: actions/setup-java@v3.6.0
      with:
        java-version: 8
        distribution: temurin
        java-package: jdk
    - name: Build with Maven
      run: mvn -B clean verify --file pom.xml
    - name: Archive Stripes zip
      uses: actions/upload-artifact@v3.1.1
      with:
        name: stripes-2.0.0-SNAPSHOT.zip
        path: dist/target/stripes-2.0.0-SNAPSHOT.zip
    - name: Archive Stripes bundle zip
      uses: actions/upload-artifact@v3.1.1
      with:
        name: stripes-2.0.0-SNAPSHOT-bundle.jar
        path: dist/target/stripes-2.0.0-SNAPSHOT-bundle.jar
    - run: mkdir docs
    - name: Zip tlddoc documentation
      uses: montudor/action-zip@v1.0.0
      with:
        args: zip -qq -r ./docs/tlddoc.zip ./stripes/target/site/tlddoc
    - name: Archive tlddoc documentation
      uses: actions/upload-artifact@v3.1.1
      with:
        name: tlddoc.zip
        path: docs
    - name: Zip apidocs documentation
      uses: montudor/action-zip@v1.0.0
      with:
        args: zip -qq -r ./docs/apidocs.zip ./stripes/target/apidocs
    - name: Archive apidocs documentation
      uses: actions/upload-artifact@v3.1.1
      with:
        name: apidocs.zip
        path: docs